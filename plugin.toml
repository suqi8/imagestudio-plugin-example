# plugin.toml — HelloPlugin 清单文件
#
# 每个 .isp 插件包的根目录必须有此文件。
# 宿主通过解析此文件识别插件元数据，无需加载任何代码。

# [plugin] 必填字段：id/name/version/entryClass/apiVersion/supportedPlatforms
[plugin]
# 唯一标识符：反向域名格式，全小写，只含字母/数字/点/短横线
id = "com.example.helloplugin"

# 用户可见的显示名称
name = "Hello Plugin"

# 版本号：遵循 SemVer（major.minor.patch）
version = "1.0.0"

# 简短描述，展示在插件列表卡片上
description = "演示 ImageStudio 原生插件 API、权限、任务与 Compose UI 集成的完整示例"

# 作者信息
author = "ImageStudio"

# 插件入口类全限定名（必须实现 ImageStudioPlugin，必须有无参构造函数）
entryClass = "com.example.helloplugin.HelloPlugin"

# 兼容的宿主 Plugin API 版本（当前固定为 "1.0"）
apiVersion = "1.0"

# 支持的平台：android / windows / macos / linux
supportedPlatforms = ["android", "windows", "macos", "linux"]

# false（默认）：在宿主弹窗中展示 UI；true：宿主打开全屏页面
customPage = true

# 安装后是否默认启用
enabledByDefault = true

[runtime]
# Desktop（Windows/macOS/Linux）的 JVM JAR 路径（相对于版本根目录）
desktopJar = "libs/helloplugin-desktop.jar"

# Android 的 dex-in-jar 路径（经 D8/R8 处理，包含 classes.dex）
androidDexJar = "libs/helloplugin-android.jar"

[permissions]
# declared      : 插件可能用到的全部权限
# requiredForRun: 缺少时插件无法运行（宿主运行前检查）
# defaultEnabled: 安装时默认开启的权限（用户可在设置里关闭）
declared = ["shell.execute", "project.read", "project.write", "task.background"]
requiredForRun = []
defaultEnabled = ["project.read", "project.write"]

[build]
minify = false
openSource = true
